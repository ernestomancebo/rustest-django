site_name: rustest-django
site_description: Django integration for rustest, a port of pytest-django.
site_url: https://rustest-django.readthedocs.io/
repo_url: https://github.com/ernestomancebo/rustest-django
repo_name: ernestomancebo/rustest-django
docs_dir: site-docs
theme:
  name: zettelkasten
  color_scheme: solarized
plugins:
  - search
  - zettelkasten
markdown_extensions:
  - admonition
  - meta
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Migration Guide: migration-guide.md
  - Reference:
      - Fixtures: reference/fixtures.md
      - Markers: reference/markers.md
      - Configuration: reference/configuration.md
      - Unsupported features: reference/unsupported.md
strict: true
