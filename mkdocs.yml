site_name: rustest-django
site_description: Django integration for rustest, a port of pytest-django.
repo_url: https://github.com/ernestomancebo/rustest-django
repo_name: ernestomancebo/rustest-django
docs_dir: site-docs
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - content.code.copy
    - search.suggest
markdown_extensions:
  - admonition
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true
nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Migration Guide: migration-guide.md
  - Reference:
      - Fixtures: reference/fixtures.md
      - Markers: reference/markers.md
      - Configuration: reference/configuration.md
      - Unsupported features: reference/unsupported.md
strict: true
