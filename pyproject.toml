[project]
name = "rustest-django"
version = "0.1.0"
description = "Django integration for rustest, a port of pytest-django."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "rustest>=0.18,<1.0",
    "tomli>=2; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rustest_django"]

[dependency-groups]
dev = ["ruff", "ty", "psycopg[binary]>=3", "pre-commit"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",
    "ERA",
    "FAST",
    "S",
    "ASYNC",
    "T20",   # No print statements
    "W",
    "F",
    "SIM",
    "I",
    "B",
    "C4",
    "UP",
]

dummy-variable-rgx = "^_$"
unfixable = ["T20"]

[tool.ruff.lint.per-file-ignores]
"**/{tests}/*" = [
    # Ignores "assert" statement
    "S101", # Ignores hardcoaded passwords
    "S105",
    "S106",
    "S107", # Ignores request timeout
    "S113",
    # subprocess calls in tests run our own CLI with a fixed, non-user-controlled
    # argument list (scratch consumer projects), never untrusted input
    "S603",
]
# Ported from pytest-django's asserts.pyi; the "with assertX(...): ..." lines are
# usage examples for the overloads below them, not commented-out code.
"**/*.pyi" = ["ERA001"]

[tool.ruff.lint.isort]
known-first-party = ["rustest_django"]

[tool.ruff.format]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"
# Like Black, respect magic trailing commas.
skip-magic-trailing-comma = false
# Unix line endings
line-ending = "lf"
# Enable auto-formatting of code examples in docstrings. Markdown,
# reStructuredText code/literal blocks and doctests are all supported.
#
# This is currently disabled by default, but it is planned for this
# to be opt-out in the future.
docstring-code-format = false
# Set the line length limit used when formatting code snippets in
# docstrings.
#
# This only has an effect when the `docstring-code-format` setting is
# enabled.
docstring-code-line-length = "dynamic"
