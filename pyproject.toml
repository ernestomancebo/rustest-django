[project]
name = "rustest-django"
version = "0.1.0"
description = "Django integration for rustest, a port of pytest-django."
readme = "README.md"
license = "BSD-3-Clause"
requires-python = ">=3.10"
dependencies = [
    "django>=4.2",
    "rustest>=0.18,<1.0",
    "tomli>=2; python_version < '3.11'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rustest_django"]

[dependency-groups]
dev = [
    "ruff",
    "ty",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
