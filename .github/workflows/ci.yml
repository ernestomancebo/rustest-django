            db-backend: "postgres"
          - example: "async-views"
            python-version: "3.13"
            django-version: "6.1"
            db-backend: "sqlite"
          - example: "async-views"
            python-version: "3.13"
            django-version: "6.1"
            db-backend: "postgres"
    env:
      TEST_DB_BACKEND: ${{ matrix.db-backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install "django==${{ matrix.django-version }}.*"
      - name: Run under pytest
        run: uv run pytest --junit-xml=pytest.xml tests/
      - name: Run under rustest --pytest-compat
        run: uv run rustest --pytest-compat --llm tests/ > rustest.jsonl
      - name: Compare outcomes
        run: uv run python ../compare_outcomes.py pytest.xml rustest.jsonl
  docs:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync --group docs
      - run: uv run mkdocs build --strict
  build:
    needs: [test, test-postgres, parity]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Build sdist and wheel
        run: uv build
      - name: Check distribution metadata
        run: uvx twine check dist/*
      - name: Install the built wheel into a fresh environment
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          /tmp/wheel-check/bin/python -c "import rustest_django; print(rustest_django.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
