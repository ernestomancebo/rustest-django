name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  UV_LOCKED: "1"
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - run: uv sync
      - run: uv run pre-commit run --all-files
      - run: uv run ty check src
  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "4.2"
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "6.1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install "django==${{ matrix.django-version }}.*"
      - run: uv run rustest tests --color=never
  test-postgres:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "4.2"
          - python-version: "3.13"
            django-version: "4.2"
          - python-version: "3.12"
            django-version: "5.2"
          - python-version: "3.13"
            django-version: "5.2"
          - python-version: "3.12"
            django-version: "6.1"
          - python-version: "3.13"
            django-version: "6.1"
    env:
      TEST_DB_BACKEND: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - run: uv sync --python ${{ matrix.python-version }}
      - name: Pin Django ${{ matrix.django-version }}
        run: uv pip install "django==${{ matrix.django-version }}.*"
      - run: uv run rustest tests --color=never
  parity:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/${{ matrix.example }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: "minimal-sqlite"
            python-version: "3.10"
            django-version: "4.2"
            db-backend: "sqlite"
          - example: "minimal-sqlite"
            python-version: "3.10"
            django-version: "4.2"
            db-backend: "postgres"
          - example: "minimal-sqlite"
            python-version: "3.12"
            django-version: "4.2"
            db-backend: "sqlite"
          - example: "minimal-sqlite"
            python-version: "3.12"
            django-version: "4.2"
            db-backend: "postgres"
          - example: "minimal-sqlite"
            python-version: "3.13"
            django-version: "4.2"
            db-backend: "sqlite"
          - example: "minimal-sqlite"
            python-version: "3.13"
            django-version: "4.2"
            db-backend: "postgres"
          - example: "minimal-sqlite"
            python-version: "3.12"
            django-version: "5.2"
            db-backend: "sqlite"
          - example: "minimal-sqlite"
            python-version: "3.12"
            django-version: "5.2"
            db-backend: "postgres"
          - example: "minimal-sqlite"
            python-version: "3.13"
            django-version: "5.2"
            db-backend: "sqlite"
          - example: "minimal-sqlite"
            python-version: "3.13"
            django-version: "5.2"
            db-backend: "postgres"
          - example: "minimal-sqlite"
            python-version: "3.12"
            django-version: "6.1"
            db-backend: "sqlite"
          - example: "minimal-sqlite"
            python-version: "3.12"
            django-version: "6.1"
            db-backend: "postgres"
          - example: "minimal-sqlite"
            python-version: "3.13"
            django-version: "6.1"
            db-backend: "sqlite"
          - example: "minimal-sqlite"
            python-version: "3.13"
            django-version: "6.1"
            db-backend: "postgres"
          - example: "multi-db"
            python-version: "3.10"
            django-version: "4.2"
            db-backend: "sqlite"
          - example: "multi-db"
