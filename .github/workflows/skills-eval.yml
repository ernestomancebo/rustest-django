name: Skills eval
on:
  push:
    branches: [main]
    paths: &skill-source-paths
      - ".github/workflows/skills-eval.yml"
      - "skills/**"
      - "docs/spec/unittest-support.md"
      - "docs/spec/upstream.md"
      - "docs/spec/async.md"
      - "site-docs/migration-guide.md"
      - "site-docs/reference/markers.md"
      - "site-docs/reference/unsupported.md"
  pull_request:
    paths: *skill-source-paths
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g @anthropic-ai/claude-code
      - name: Run rustest-django-migrate-tests / rustest-django-doctor eval suite
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          claude plugin eval skills --trust-plugin --threshold 1.0 \
            --json skills/evals/results/ci-run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skills-eval-report
          path: skills/evals/results/
